name: CI · Lockatus (GHCR)

# Gate pre-deploy del ecosistema: ningún cambio se publica a GHCR si los tests están en rojo.
# `test` (núcleo cripto + novedades, sin DB) + `integ` (2FA / OIDC / recovery / SSO contra Postgres) → build-push.
# build-push (push a main): tags :latest + :X.Y.Z (de package.json) + :sha, label OCI de version y
# Release vX.Y.Z con las notas de esa version del CHANGELOG.md. Tag vX.Y.Z: :vX.Y.Z + :X.Y.Z + :X.Y.
# Cada version dice que cambia: sin su seccion en el CHANGELOG el build no sale.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - run: npm ci
      - name: Núcleo cripto (sin DB)
        run: npm test

  integ:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lockatus
          POSTGRES_PASSWORD: ci-secret
          POSTGRES_DB: lockatus
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U lockatus -d lockatus"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: "postgresql://lockatus:ci-secret@127.0.0.1:55433/lockatus"
      LOCKATUS_SECRET: "ci-master-secret-0123456789abcdef"
      LOCKATUS_ADMIN_PASS: "admin1234"
      LOCKATUS_ISSUER: "http://localhost:8081"
      PORT: "8081"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - run: npm ci
      - name: Levantar Lockatus + la app demo
        run: |
          node server/index.js > /tmp/lk.log 2>&1 &
          PORT=8090 LOCKATUS_ISSUER=http://localhost:8081 node examples/demo-app/server.mjs > /tmp/demo.log 2>&1 &
          npx --yes wait-on http://localhost:8081/health http://localhost:8090/ -t 30000
      - name: Integración (2FA · OIDC · recovery · SSO cliente)
        run: npm run test:integ && node test/client-check.mjs
      - name: Logs si falla
        if: failure()
        run: cat /tmp/lk.log /tmp/demo.log || true

  build-push:
    needs: [test, integ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear el tag y el Release de la version
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Version y novedades (CHANGELOG)
        id: ver
        run: |
          V="$(node scripts/notas-version.mjs --version)"
          node scripts/notas-version.mjs > "$RUNNER_TEMP/notas.md"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          {
            echo "## Lockatus v$V"
            echo
            cat "$RUNNER_TEMP/notas.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release de la version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::warning::La v$V ya estaba publicada: este deploy no subio la version (patch) ni sumo novedades."
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "Lockatus v$V" --notes-file "$RUNNER_TEMP/notas.md"
          fi
